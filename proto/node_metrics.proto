syntax = "proto3";

package nodemetrics;

option go_package = "github.com/pmady/keda-gpu-scaler/pkg/nodemetrics";

// NodeMetrics is the internal contract between the aggregator and the agents.
// KEDA never talks to this service; the aggregator calls it to read one node's
// GPUs before combining them with the rest of the fleet.
service NodeMetrics {
    // GetDevices returns the current metrics of every GPU on the agent's node.
    rpc GetDevices(GetDevicesRequest) returns (GetDevicesResponse) {}
}

message GetDevicesRequest {}

message DeviceMetrics {
    uint32 index = 1;
    string uuid = 2;
    string name = 3;
    uint32 gpu_utilization = 4;
    uint32 memory_utilization = 5;
    uint64 memory_used_mib = 6;
    uint64 memory_total_mib = 7;
    uint32 temperature_celsius = 8;
    uint32 power_draw_watts = 9;
    uint32 power_limit_watts = 10;
    uint32 pcie_tx_kbps = 11;
    uint32 pcie_rx_kbps = 12;
    uint64 nvlink_tx_mbps = 13;
    uint64 nvlink_rx_mbps = 14;
    bool mig_instance = 15;
    int32 parent_index = 16;
    string mig_profile = 17;
}

message GetDevicesResponse {
    // Name of the node serving this response, for logs on the aggregator side.
    string node = 1;
    repeated DeviceMetrics devices = 2;
}
