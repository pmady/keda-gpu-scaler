apiVersion: v1
kind: Service
metadata:
  name: {{ include "keda-gpu-scaler.fullname" . }}
  labels:
    {{- include "keda-gpu-scaler.labels" . | nindent 4 }}
spec:
  {{- if .Values.aggregator.enabled }}
  # Headless: the aggregator resolves one address per ready agent pod.
  clusterIP: None
  {{- end }}
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- if .Values.metrics.enabled }}
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "keda-gpu-scaler.selectorLabels" . | nindent 4 }}
