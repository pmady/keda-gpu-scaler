# Infra Validate
#
# Cheap per-PR gate for infra/terraform/{aws,azure,gcp}, complementing the
# expensive real-GPU suite in e2e-apply.yaml (workflow_dispatch-only).
#
#   - fmt/validate/tflint/trivy/zizmor: credential-less, BLOCKING on every PR.
#   - docs: PR-only, single job (avoids racing pushes) that regenerates
#     terraform-docs and pushes the change back to the PR branch.
#
# Cost estimates live with the e2e-plan.yml and e2e-apply.yaml jobs
# (Infracost in each job summary), not here.
name: Infra Validate

on:
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/infra-validate.yaml']
  push:
    branches: [main]
    paths: ['infra/terraform/**', '.github/workflows/infra-validate.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6

      - name: terraform fmt -check
        run: terraform fmt -check -recursive infra/terraform

  validate:
    name: terraform validate (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, gcp, aws/bootstrap, azure/bootstrap, gcp/bootstrap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.6

      # -backend=false: no cloud credentials needed to init providers/modules.
      - name: terraform init (no backend)
        run: terraform -chdir=infra/terraform/${{ matrix.cloud }} init -backend=false -input=false

      # validate only reads provider schemas locally, no credentials needed.
      - name: terraform validate
        run: terraform -chdir=infra/terraform/${{ matrix.cloud }} validate

  tflint:
    name: tflint (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, azure, gcp, aws/bootstrap, azure/bootstrap, gcp/bootstrap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --chdir=infra/terraform/${{ matrix.cloud }} --init

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --chdir=infra/terraform/${{ matrix.cloud }} -f compact

  # Static, credential-less Terraform misconfig scan; BLOCKING like fmt/validate/tflint.
  # Suppress acceptable findings via .trivyignore — don't disable this gate.
  trivy:
    name: trivy (terraform misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config scan
        run: |
          docker run --rm -v "${PWD}:/src" aquasec/trivy:0.58.1 \
            config --exit-code 1 --severity HIGH,CRITICAL \
            --misconfig-scanners terraform \
            --ignorefile /src/.trivyignore /src/infra

  # Static, credential-less GitHub Actions workflow security scan; BLOCKING.
  # Scoped to this repo's own feature workflows at high confidence.
  zizmor:
    name: zizmor (workflow security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.28.0 --offline --min-confidence high \
            .github/workflows/e2e-apply.yaml \
            .github/workflows/e2e-plan.yml \
            .github/workflows/e2e-destroy.yaml \
            .github/workflows/infra-validate.yaml

  # Regenerates each stack's README.md doc block and pushes back to the PR
  # branch. Single job (not matrixed) to avoid three jobs racing to push.
  docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    # Same-repo PRs only: this job git-pushes the regenerated README back to the
    # PR branch, which a fork PR can't do (base repo checked out, read-only token).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      # Keeps persisted git credentials on purpose: terraform-docs pushes the
      # regenerated README back to the branch below (read-only jobs set it off).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: terraform-docs (aws)
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: infra/terraform/aws
          output-file: README.md
          output-method: inject
          git-push: "true"

      - name: terraform-docs (azure)
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: infra/terraform/azure
          output-file: README.md
          output-method: inject
          git-push: "true"

      - name: terraform-docs (gcp)
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: infra/terraform/gcp
          output-file: README.md
          output-method: inject
          git-push: "true"
